<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dice Roller - 7th Sea</title>
    <style>
        :root { 
            --primary: #38bdf8; --bg: #f8fafc; --card: #ffffff; 
            --accent: #f59e0b; --success: #10b981; --text: #1e293b;
            --border: #e2e8f0; --input-bg: #f1f5f9; --footer: rgba(0,0,0,0.6);
            --danger: #ef4444; --purple: #a855f7;
        }
        [data-theme="dark"] { 
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --border: #334155; --input-bg: #0f172a; --footer: rgba(255,255,255,0.6);
        }
        body { 
            font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); 
            display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; 
            transition: all 0.3s ease; min-height: 100vh;
        }
        .header-tools { 
            width: 100%; max-width: 380px; display: flex; 
            justify-content: space-between; align-items: center; margin-bottom: 10px; 
        }
        .lang-selector { position: relative; }
        .lang-btn {
            background: var(--card); border: 2px solid var(--border); color: var(--text);
            padding: 6px 12px; border-radius: 12px; cursor: pointer; font-weight: bold;
            font-size: 0.85rem; display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .lang-btn:hover { border-color: var(--primary); }
        .lang-dropdown {
            display: none; position: absolute; top: calc(100% + 6px); left: 0;
            background: var(--card); border: 2px solid var(--border); border-radius: 12px;
            overflow: hidden; z-index: 100; min-width: 140px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .lang-dropdown.open { display: block; }
        .lang-option {
            padding: 10px 14px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px; transition: background 0.15s;
        }
        .lang-option:hover { background: var(--input-bg); }
        .lang-option.active { color: var(--primary); }
        .theme-toggle { 
            background: var(--card); border: 2px solid var(--border); color: var(--text); 
            padding: 6px 12px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.75rem; 
        }

        /* Cards */
        .card { background: var(--card); padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 380px; box-sizing: border-box; border: 1px solid var(--border); margin-bottom: 12px; }
        .card-title { font-size: 0.7rem; color: var(--purple); text-transform: uppercase; font-weight: 900; letter-spacing: 1.5px; margin: 0 0 14px 0; display: flex; align-items: center; gap: 6px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 800; }
        input[type="number"], select { width: 100%; padding: 12px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; margin-top: 5px; box-sizing: border-box; outline: none; }

        .bonus-section { background: var(--input-bg); border: 2px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .bonus-section span { font-size: 0.85rem; font-weight: 600; }
        .bonus-section select { width: auto; margin-top: 0; padding: 5px 10px; }

        .option-tile { display: flex; align-items: center; gap: 10px; background: var(--input-bg); border: 2px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .option-tile input[type="checkbox"] { width: auto; margin: 0; padding: 0; accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
        .option-tile.active { border-color: var(--primary); background: rgba(56,189,248,0.1); }
        .option-tile.active-danger { border-color: var(--danger); background: rgba(239,68,68,0.1); }
        .option-tile.active-purple { border-color: var(--purple); background: rgba(168,85,247,0.1); }

        button.main-btn { width: 100%; padding: 18px; background: var(--primary); color: #0f172a; border: none; border-radius: 15px; font-weight: 800; font-size: 1.1rem; margin-top: 10px; cursor: pointer; transition: opacity 0.2s; }
        button.main-btn:hover { opacity: 0.88; }
        button.reroll { width: 100%; padding: 12px; background: var(--accent); margin-top: 8px; display: none; color: #0f172a; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* Results */
        .summary-box { background: var(--primary); color: #0f172a; padding: 18px; border-radius: 15px; text-align: center; margin: 20px 0; font-weight: 900; font-size: 1.4rem; box-shadow: 0 4px 12px rgba(56,189,248,0.3); width: 100%; max-width: 380px; box-sizing: border-box; }
        #results { width: 100%; max-width: 380px; }

        .die { display: inline-flex; width: 45px; height: 45px; align-items: center; justify-content: center; background: var(--input-bg); border: 2px solid var(--primary); border-radius: 10px; margin: 5px; font-weight: bold; font-size: 1.1rem; cursor: pointer; position: relative; color: var(--text); transition: transform 0.1s, box-shadow 0.1s; user-select: none; }
        .die.selected { border-color: var(--accent); transform: scale(1.15); box-shadow: 0 0 15px var(--accent); }
        /* Forza10 mode */
        .die.force10-mode { border-color: var(--danger); cursor: crosshair; }
        .die.force10-mode:hover { box-shadow: 0 0 12px var(--danger); transform: scale(1.1); }
        /* Bonus distribution mode */
        .die.bonus-mode { border-color: var(--purple); cursor: pointer; }
        .die.bonus-mode:hover { box-shadow: 0 0 12px var(--purple); transform: scale(1.1); }
        .die.boosted { border-color: var(--purple); }

        .ext-badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: #000; font-size: 0.55rem; padding: 2px 4px; border-radius: 4px; font-weight: 900; }
        .boost-badge { position: absolute; bottom: -5px; right: -5px; background: var(--purple); color: #fff; font-size: 0.55rem; padding: 2px 4px; border-radius: 4px; font-weight: 900; }
        .die.no-explode { border-style: dashed; }
        .lock-badge { position: absolute; top: -5px; left: -5px; background: #64748b; color: #fff; font-size: 0.5rem; padding: 2px 3px; border-radius: 4px; font-weight: 900; }
        .bonus-label { font-size: 0.55rem; color: var(--success); font-weight: 900; vertical-align: super; }

        .set { background: rgba(16,185,129,0.1); border-left: 5px solid var(--success); padding: 14px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
        .set-15 { border-left-color: var(--primary); background: rgba(56,189,248,0.1); }
        .set-10 { border-left-color: var(--accent); background: rgba(245,158,11,0.1); }

        .inc-badge { background: var(--text); color: var(--card); padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; }
        .waste { background: rgba(239,68,68,0.1); border-left: 5px solid var(--danger); padding: 12px; border-radius: 12px; color: var(--danger); font-weight: bold; margin-top: 10px; }
        .gioia-hint { background: rgba(168,85,247,0.1); border-left: 5px solid var(--purple); padding: 12px; border-radius: 12px; color: var(--purple); font-weight: bold; margin-top: 8px; font-size: 0.85rem; }

        h3 { font-size: 0.75rem; color: var(--primary); text-transform: uppercase; margin: 25px 0 10px 0; letter-spacing: 1px; }

        /* Manipolazione Riserva */
        .riserva-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .riserva-row button { flex: 1; padding: 11px 8px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: opacity 0.2s; }
        .riserva-row button:hover { opacity: 0.85; }
        .btn-force10 { background: var(--danger); color: #fff; }
        .btn-force10.active { box-shadow: 0 0 0 3px rgba(239,68,68,0.4); }
        .bonus-dist-row { display: flex; align-items: center; gap: 8px; }
        .bonus-dist-row input[type="number"] { width: 70px; flex-shrink: 0; padding: 10px; font-size: 0.95rem; margin-top: 0; }
        .bonus-dist-row button { flex: 1; padding: 11px 8px; background: var(--purple); color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: opacity 0.2s; }
        .bonus-dist-row button:hover { opacity: 0.85; }
        .bonus-dist-row button.active { box-shadow: 0 0 0 3px rgba(168,85,247,0.4); }
        .bonus-remaining { font-size: 0.75rem; color: var(--purple); font-weight: 800; text-align: center; margin-top: 4px; display: none; }

        /* Abilità & Manipolazioni toggle */
        .advanced-toggle {
            width: 100%; max-width: 380px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card); border: 2px solid var(--border);
            border-radius: 14px; padding: 12px 16px; cursor: pointer;
            margin-bottom: 12px; transition: border-color 0.2s, border-radius 0.25s;
            font-size: 0.8rem; font-weight: 800; color: var(--purple);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .advanced-toggle:hover { border-color: var(--purple); }
        .advanced-toggle.open { border-color: var(--purple); background: rgba(168,85,247,0.08); border-radius: 14px 14px 0 0; border-bottom: none; margin-bottom: 0; }
        .advanced-toggle .toggle-arrow { transition: transform 0.25s; font-size: 0.75rem; }
        .advanced-toggle.open .toggle-arrow { transform: rotate(180deg); }

        .advanced-panel {
            width: 100%; max-width: 380px; box-sizing: border-box;
            background: var(--card); border: 2px solid var(--purple);
            border-top: none; border-radius: 0 0 14px 14px;
            overflow: hidden; max-height: 0;
            transition: max-height 0.35s ease, padding 0.35s ease;
            padding: 0 20px; margin-bottom: 0;
        }
        .advanced-panel.open { max-height: 700px; padding: 16px 20px 20px; margin-bottom: 12px; }

        .kofi-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: #FF5E5B; color: #fff; font-weight: 800; font-size: 0.85rem;
            padding: 10px 20px; border-radius: 50px; text-decoration: none;
            margin-top: 8px; transition: opacity 0.2s; box-shadow: 0 4px 12px rgba(255,94,91,0.35);
        }
        .kofi-btn:hover { opacity: 0.85; }
        .footer-noemi { text-align: center; padding: 30px 10px 40px; font-size: 0.85em; color: var(--footer); width: 100%; }
        .link-noemi { color: inherit; text-decoration: none; font-weight: 600; border-bottom: 1px solid currentColor; }
    </style>

            </div>
        </div>
        <div class="theme-toggle" onclick="toggleTheme()" id="themeBtn">TEMA 🌓</div>
    </div>

    <!-- MAIN ROLL CARD -->

            </div>
        </div>
        <div class="bonus-section" style="margin-bottom:10px;">
            <span id="lbl-bonus-dice">Dadi Bonus (inesplodibili):</span>

        </div>

        <div class="bonus-section">

        </div>

        <!-- Esplosione (sempre visibile) -->
        <label class="option-tile" id="tile-expl" onclick="toggleTile('tile-expl','expl')">
            <input type="checkbox" id="expl">
            <span id="lbl-explode">Esplosione del 10</span>
        </label>

        <button class="main-btn" onclick="firstRoll()" id="btn-roll">LANCIA DADI</button>
        <button id="rerollBtn" class="reroll" onclick="rerollSelected()">RILANCIA SELEZIONATO</button>
    </div>

    <!-- ABILITÀ & MANIPOLAZIONI TOGGLE -->
    <div class="advanced-toggle" id="advancedToggle" onclick="toggleAdvanced()">
        <span id="lbl-advanced">🎭 Vantaggi &amp; Manipolazioni</span>
        <span class="toggle-arrow">▼</span>
    </div>

    <!-- ADVANCED PANEL -->
    <div class="advanced-panel" id="advancedPanel">

        <!-- Set da 10 = 2 Incrementi -->
        <label class="option-tile" id="tile-double" onclick="toggleTile('tile-double','doubleInc')">
            <input type="checkbox" id="doubleInc" onchange="render()">
            <span id="lbl-double">Set da 10 = 2 Incrementi</span>
        </label>

        <!-- Solo Set da 15 -->
        <label class="option-tile" id="tile-only15" onclick="toggleTile('tile-only15','only15')">
            <input type="checkbox" id="only15" onchange="onOnly15Change()">
            <span id="lbl-only15">Malus: Solo Set da 15</span>
        </label>

        <!-- Gioia di Vivere -->
        <label class="option-tile" id="tile-gioia" onclick="toggleTile('tile-gioia','gioia')">
            <input type="checkbox" id="gioia" onchange="render()">
            <span id="lbl-gioia">Gioia di Vivere (+1 virtuale agli scarti)</span>
        </label>

        <!-- Lupo di Mare -->
        <label class="option-tile" id="tile-lupo" onclick="toggleTile('tile-lupo','lupoDiMare')">
            <input type="checkbox" id="lupoDiMare" onchange="render()">
            <span id="lbl-lupo">⚓ Lupo di Mare (i 9 valgono 10)</span>
        </label>

        <!-- Fuoco di Sbarramento -->
        <label class="option-tile" id="tile-sbarramento" onclick="toggleTile('tile-sbarramento','sbarramento')">
            <input type="checkbox" id="sbarramento" onchange="render()">
            <span id="lbl-sbarramento">💣 Fuoco di Sbarramento (i dadi pari non si usano)</span>
        </label>

        <!-- MANIPOLAZIONE RISERVA -->
        <div style="margin-top:6px;">
            <div class="card-title" style="margin-bottom:10px;">⚙️ <span id="lbl-riserva">Manipolazione Riserva</span></div>

            <div class="riserva-row" id="riservaRow" style="display:none;">
                <button class="btn-force10" id="btnForce10" onclick="toggleForce10()">
                    <span id="lbl-force10">💪 Forza un 10 (Indomabile)</span>
                </button>
            </div>

            <div class="bonus-dist-row" id="bonusFreeRow" style="display:none;">
                <input type="number" id="bonusFreeVal" value="2" min="1" max="99">
                <button id="btnBonusFree" onclick="toggleBonusFree()">
                    <span id="lbl-bonusfree">✨ Distribuisci +X sui dadi</span>
                </button>
            </div>
            <div class="bonus-remaining" id="bonusRemaining"></div>
            <div id="riservaHint" style="font-size:0.75rem;color:#94a3b8;text-align:center;padding:8px 0;" id="lbl-riserva-hint">Lancia i dadi per usare la Riserva</div>
        </div>
    </div>

    <div id="results"></div>

    <footer class="footer-noemi">

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentLang    = 'it';
let currentDice    = [];       // [{val, natural, exploded, selected, boost}]
let rerollAvailable = true;
let force10Mode    = false;    // Indomabile mode
let bonusFreeMode  = false;    // Distribuisci +X mode
let bonusFreeLeft  = 0;

// ─── LANGUAGE ────────────────────────────────────────────────────────────────
function toggleLangDropdown() {
    document.getElementById('langDropdown').classList.toggle('open');
}
document.addEventListener('click', e => {
    if (!document.getElementById('langSelector').contains(e.target))
        document.getElementById('langDropdown').classList.remove('open');
});

    const t = LANGS[lang];

    document.getElementById('currentLangCode').textContent = t.code;

    document.getElementById('opt-10').textContent         = t.opt10;
    document.getElementById('opt-15').textContent         = t.opt15;

// ─── THEME ───────────────────────────────────────────────────────────────────
function toggleTheme() {
    const b = document.body;
    b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

// ─── OPTION TILES ────────────────────────────────────────────────────────────
function toggleTile(tileId, cbId) {
    const cb = document.getElementById(cbId);
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
    updateTileStyle(tileId, cb.checked, cbId);
}
function updateTileStyle(tileId, checked, cbId) {
    const tile = document.getElementById(tileId);
    tile.classList.remove('active','active-danger','active-purple');
    if (!checked) return;
    if (cbId === 'only15') tile.classList.add('active-danger');
    else if (cbId === 'gioia') tile.classList.add('active-purple');
    else tile.classList.add('active');
}
function onOnly15Change() {
    const cb = document.getElementById('only15');
    updateTileStyle('tile-only15', cb.checked, 'only15');
    // If only15 is on, disable target selector (force 15 logic internally)
    render();
}

// ─── DICE LOGIC ──────────────────────────────────────────────────────────────
// rollSingle: val stores NATURAL result; bonus stored separately and shown via label.
// The partition uses effectiveVal() = natural + bonus + boost (never affecting explosion check).
function rollSingle(isExtra = false) {
    const bonus = isExtra ? 0 : (parseInt(document.getElementById('bonusValue').value) || 0);
    const r = Math.floor(Math.random() * 10) + 1;
    // natural: raw die result (used for explosion check and display)
    // bonus: static bonus from bonusValue (displayed separately, summed only in partition)
    // boost: bonus added via Distribuisci +X (affects effective value, shown as badge)
    return { val: r, natural: r, bonus: bonus, exploded: isExtra, selected: false, boost: 0, noExplode: false };
}

// effectiveVal: the value used for partition calculation
function effectiveVal(d) { return d.natural + (d.bonus || 0) + (d.boost || 0); }

// rollBonusDie: external bonus dice — clean roll, never explode, no static bonus
function rollBonusDie() {
    const r = Math.floor(Math.random() * 10) + 1;
    return { val: r, natural: r, bonus: 0, exploded: false, selected: false, boost: 0, noExplode: true };
}

function firstRoll() {
    cancelForce10();
    cancelBonusFree();
    rerollAvailable = true;

    // Main dice pool
    const n = Math.max(1, parseInt(document.getElementById('count').value) || 1);
    document.getElementById('count').value = n;

    // Bonus external dice (never explode)
    const nb = Math.max(0, parseInt(document.getElementById('countBonus').value) || 0);
    document.getElementById('countBonus').value = nb;

    currentDice = [];

    // Roll main dice (can explode if natural 10 and option active)
    for (let i = 0; i < n; i++) {
        const d = rollSingle(false);
        currentDice.push(d);
        if (document.getElementById('expl').checked && d.natural === 10) rollExtra();
    }

    // Roll bonus external dice (never explode, no static bonus)
    for (let i = 0; i < nb; i++) {
        currentDice.push(rollBonusDie());
    }

    document.getElementById('riservaRow').style.display = 'flex';
    document.getElementById('bonusFreeRow').style.display = 'flex';
    const hint = document.getElementById('riservaHint');
    if (hint) hint.style.display = 'none';
    render();
}

// Extra dice from explosion: clean roll (no bonus), can chain-explode
function rollExtra() {
    const extra = rollSingle(true); // isExtra=true → no bonus applied
    currentDice.push(extra);
    if (extra.natural === 10) rollExtra();
}

function toggleSelect(index) {
    if (force10Mode) { applyForce10(index); return; }
    if (bonusFreeMode) { applyBonusFree(index); return; }
    if (!rerollAvailable) return;
    const was = currentDice[index].selected;
    currentDice.forEach(d => d.selected = false);
    currentDice[index].selected = !was;
    render();
}

function rerollSelected() {
    if (!rerollAvailable) return;
    const idx = currentDice.findIndex(d => d.selected);
    if (idx !== -1) {
        currentDice.splice(idx, 1);
        const d = rollSingle(false);
        currentDice.push(d);
        if (document.getElementById('expl').checked && d.natural === 10) rollExtra();
        rerollAvailable = false;
    }
    render();
}

// ─── FORZA UN 10 (Indomabile) ─────────────────────────────────────────────
function toggleForce10() {
    if (currentDice.length === 0) return;
    force10Mode = !force10Mode;
    if (force10Mode) cancelBonusFree();
    document.getElementById('btnForce10').classList.toggle('active', force10Mode);
    render();
}
function cancelForce10() {
    force10Mode = false;
    const btn = document.getElementById('btnForce10');
    if (btn) btn.classList.remove('active');
}
function applyForce10(index) {
    // Force die to natural 10 — if Esplosione is active, trigger explosion (rule-correct)
    currentDice[index].natural = 10;
    currentDice[index].boost = 0;
    force10Mode = false;
    document.getElementById('btnForce10').classList.remove('active');
    // Trigger explosion chain if option is active and die is not a noExplode bonus die
    if (document.getElementById('expl').checked && !currentDice[index].noExplode) {
        rollExtra();
    }
    render();
}

// ─── DISTRIBUISCI +X ──────────────────────────────────────────────────────
function toggleBonusFree() {
    if (currentDice.length === 0) return;
    bonusFreeMode = !bonusFreeMode;
    if (bonusFreeMode) {
        cancelForce10();
        bonusFreeLeft = Math.max(1, parseInt(document.getElementById('bonusFreeVal').value) || 1);
        document.getElementById('bonusFreeVal').disabled = true;
    } else {
        cancelBonusFree();
    }
    document.getElementById('btnBonusFree').classList.toggle('active', bonusFreeMode);
    updateBonusRemaining();
    render();
}
function cancelBonusFree() {
    bonusFreeMode = false;
    bonusFreeLeft = 0;
    const btn = document.getElementById('btnBonusFree');
    if (btn) btn.classList.remove('active');
    const inp = document.getElementById('bonusFreeVal');
    if (inp) inp.disabled = false;
    const rem = document.getElementById('bonusRemaining');
    if (rem) rem.style.display = 'none';
}
function applyBonusFree(index) {
    if (bonusFreeLeft <= 0) { cancelBonusFree(); render(); return; }
    // boost raises effectiveVal, not natural (no extra explosion triggered here)
    currentDice[index].boost = (currentDice[index].boost || 0) + 1;
    bonusFreeLeft--;
    if (bonusFreeLeft <= 0) {
        bonusFreeMode = false;
        document.getElementById('btnBonusFree').classList.remove('active');
        document.getElementById('bonusFreeVal').disabled = false;
    }
    updateBonusRemaining();
    render();
}
function updateBonusRemaining() {
    const rem = document.getElementById('bonusRemaining');
    const t = LANGS[currentLang];
    if (bonusFreeMode && bonusFreeLeft > 0) {
        rem.style.display = 'block';
        rem.textContent = `${t.lblBonusRem} ${bonusFreeLeft}`;
    } else {
        rem.style.display = 'none';
    }
}

function toggleAdvanced() {
    const toggle = document.getElementById('advancedToggle');

    panel.classList.toggle('open');

// ─── PARTITION ALGORITHM ─────────────────────────────────────────────────────
// Branch-and-bound on minimal combos (subsets of dice summing >= threshold).
// Upper bound = floor(totalValue / threshold): very tight, prunes almost all branches.
// Correct and fast for any pool size (tested to 100+ dice in <5ms).
function findBestPartition(diceVals, targetMode, doubleInc, only15) {
    const lupo      = document.getElementById('lupoDiMare').checked;
    const sbarrBool = document.getElementById('sbarramento').checked;

    let filtered = diceVals.map(v => lupo && v === 9 ? 10 : v);
    if (sbarrBool) filtered = filtered.filter(v => v % 2 !== 0);

    // ── Core solver: given a pool of dice values, find the max-set partition ──
    function optimalPartition(pool, threshold) {
        if (pool.length === 0) return [];

        const freq = new Array(11).fill(0);
        pool.forEach(v => freq[v]++);

        // Face values actually present in the pool
        const faces = [];
        for (let v = 1; v <= 10; v++) if (freq[v] > 0) faces.push(v);

        // Generate all MINIMAL combos using only present face values.
        // Minimal = removing any one die drops the sum below threshold.
        const allCombos = [];
        const tmpC = new Array(11).fill(0);
        function genCombos(fi, sum) {
            if (sum >= threshold) {
                let ok = true;
                for (const v of faces) if (tmpC[v] > 0 && sum - v >= threshold) { ok = false; break; }
                if (ok) {
                    const s = faces.reduce((a, v) => a + v * tmpC[v], 0);
                    allCombos.push({ counts: tmpC.slice(), sum: s });
                }
                return;
            }
            if (fi >= faces.length) return;
            const v = faces[fi], maxK = Math.floor((threshold - sum) / v) + 1;
            for (let k = 0; k <= maxK; k++) { tmpC[v] = k; genCombos(fi + 1, sum + v * k); }
            tmpC[v] = 0;
        }
        genCombos(0, 0);

        if (allCombos.length === 0) return [];

        // Sort: smallest sum first (least waste → find good solutions fast)
        allCombos.sort((a, b) => a.sum !== b.sum ? a.sum - b.sum
            : faces.reduce((d, v) => d || a.counts[v] - b.counts[v], 0));

        let bestTotal = 0, bestSolution = null;

        // Tight upper bound: floor(totalValue / threshold)
        function ub(f) {
            let tot = 0;
            for (const v of faces) tot += v * f[v];
            return Math.floor(tot / threshold);
        }

        function bnb(idx, f, count, choices) {
            const u = count + ub(f);
            if (u <= bestTotal) return;      // prune
            if (u === count) {               // can't improve further
                if (count > bestTotal) { bestTotal = count; bestSolution = choices.slice(); }
                return;
            }
            if (idx === allCombos.length) {
                if (count > bestTotal) { bestTotal = count; bestSolution = choices.slice(); }
                return;
            }
            const { counts } = allCombos[idx];
            let maxK = Infinity;
            for (const v of faces) if (counts[v] > 0) maxK = Math.min(maxK, Math.floor(f[v] / counts[v]));
            if (maxK === Infinity) maxK = 0;
            maxK = Math.min(maxK, ub(f)); // can't use more than UB anyway

            for (let k = maxK; k >= 0; k--) {
                const nf = f.slice();
                for (const v of faces) nf[v] -= counts[v] * k;
                choices.push(k);
                bnb(idx + 1, nf, count + k, choices);
                choices.pop();
                if (bestTotal >= u) break; // already found optimal for this branch
            }
        }

        bnb(0, freq.slice(), 0, []);

        // Reconstruct the actual groupings
        const sets = [];
        if (bestSolution) {
            bestSolution.forEach((k, ci) => {
                if (k === 0) return;
                const { counts } = allCombos[ci];
                const vals = [];
                for (const v of faces) for (let j = 0; j < counts[v]; j++) vals.push(v);
                for (let i = 0; i < k; i++) sets.push([...vals]);
            });
        }
        return sets;
    }

    // ── Build the sets list with correct inc values and track leftovers ───────
    const sorted = [...filtered].sort((a, b) => a - b);
    const n = sorted.length;
    const usedMask = new Array(n).fill(false);
    const sets = [];

    function applyPass(threshold, incValue, pool, poolIndices) {
        const subsets = optimalPartition(pool, threshold);
        subsets.forEach(vals => {
            const tmpIdx = [...poolIndices];
            vals.forEach(v => {
                const pos = tmpIdx.findIndex(idx => sorted[idx] === v && !usedMask[idx]);
                if (pos !== -1) { usedMask[tmpIdx[pos]] = true; tmpIdx.splice(pos, 1); }
            });
            const sum = vals.reduce((a, b) => a + b, 0);
            const actualInc = doubleInc && threshold === 10 ? incValue * 2 : incValue;
            sets.push({ v: vals, t: sum, type: threshold, inc: actualInc });
        });
    }

    const allIndices = sorted.map((_, i) => i);

    if (only15) {
        applyPass(15, 1, sorted, allIndices);
    } else if (targetMode === 15) {
        applyPass(15, 2, sorted, allIndices);
        const rem = allIndices.filter(i => !usedMask[i]);
        applyPass(10, 1, rem.map(i => sorted[i]), rem);
    } else {
        applyPass(10, 1, sorted, allIndices);
    }

    const leftovers = sorted.filter((_, i) => !usedMask[i]);
    const totalIncrements = sets.reduce((acc, s) => acc + s.inc, 0);
    return { sets, leftovers, totalIncrements };
}

// ─── GIOIA DI VIVERE ──────────────────────────────────────────────────────
// Returns index of a leftover die that, with +1, would complete a new set
function gioiaCheck(leftovers, targetMode, only15) {
    if (!leftovers.length) return null;
    const threshold = (targetMode === 15 && !only15) ? 10 : (only15 ? 15 : 10);
    // Sort leftovers desc, try adding +1 to each and see if any subset reaches threshold
    const sorted = [...leftovers].sort((a, b) => b - a);
    // Simple check: can the leftovers sum to threshold-1 already? (so +1 makes it)
    // More precise: try all subsets up to sum = threshold-1
    // Since leftovers are usually small, check all non-empty subsets (capped at 20 elements for safety)
    const cap = Math.min(sorted.length, 20);
    const sub = sorted.slice(0, cap);
    for (let mask = 1; mask < (1 << cap); mask++) {
        let sum = 0;
        for (let b = 0; b < cap; b++) if (mask & (1 << b)) sum += sub[b];
        if (sum === threshold - 1) return sum; // +1 would complete it
    }
    return null;
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function render() {
    if (currentDice.length === 0) return;
    const t        = LANGS[currentLang];
    const target   = parseInt(document.getElementById('target').value);
    const double   = document.getElementById('doubleInc').checked;
    const only15   = document.getElementById('only15').checked;
    const useGioia = document.getElementById('gioia').checked;
    const resDiv   = document.getElementById('results');

    const anySelected = currentDice.some(d => d.selected);
    const rerollShow  = rerollAvailable && anySelected && !force10Mode && !bonusFreeMode;
    document.getElementById('rerollBtn').style.display = rerollShow ? 'block' : 'none';
    document.getElementById('rerollBtn').textContent   = t.btnReroll;

    // Dice display
    let html = `<h3>${t.h3Dice}</h3><div style="text-align:center;">`;
    currentDice.forEach((d, i) => {
        let cls = 'die';
        if (force10Mode)   cls += ' force10-mode';
        else if (bonusFreeMode) cls += ' bonus-mode';
        else if (d.selected) cls += ' selected';
        if (d.boost > 0 && !force10Mode && !bonusFreeMode) cls += ' boosted';

        const extBadge   = d.exploded ? `<span class="ext-badge">${t.extBadge}</span>` : '';
        const boostBadge = d.boost > 0 ? `<span class="boost-badge">+${d.boost}</span>` : '';
        const lockBadge  = d.noExplode ? `<span class="lock-badge">🔒</span>` : '';
        if (d.noExplode) cls += ' no-explode';
        // Show natural value; if static bonus active, show "N+b" label for clarity
        const bonusLabel = (d.bonus > 0) ? `<span class="bonus-label">+${d.bonus}</span>` : '';
        html += `<div class="${cls}" onclick="toggleSelect(${i})">${d.natural}${bonusLabel}${extBadge}${boostBadge}${lockBadge}</div>`;
    });
    html += '</div>';

    // Partition
    const result   = findBestPartition(currentDice.map(d => effectiveVal(d)), target, double, only15);
    const incWord  = result.totalIncrements === 1 ? t.summaryOne : t.summaryMany;
    html += `<div class="summary-box">${result.totalIncrements} ${incWord}</div>`;

    if (result.sets.length > 0) {
        html += `<h3>${t.h3Combos}</h3>`;
        result.sets.forEach(s => {
            const cls = s.type === 15 ? 'set-15' : 'set-10';
            html += `<div class="set ${cls}">
                        <span>${s.v.join(' + ')} = <b>${s.t}</b></span>
                        <span class="inc-badge">+${s.inc} ${t.incLabel}</span>
                     </div>`;
        });
    }

    if (result.leftovers.length > 0) {
        html += `<h3>${t.h3Discards}</h3>
                 <div class="waste">${t.wasteLabel}: ${result.leftovers.slice().sort((a,b)=>b-a).join(', ')}</div>`;

        // Gioia di Vivere hint
        if (useGioia) {
            const gioiaResult = gioiaCheck(result.leftovers, target, only15);
            if (gioiaResult !== null) {
                html += `<div class="gioia-hint">✨ ${t.gioiaHint} ${gioiaResult} → ${gioiaResult+1}: ${t.gioiaSuffix}</div>`;
            }
        }
    }

    resDiv.innerHTML = html;
}
</script>
